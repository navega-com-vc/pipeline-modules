name: web-deploy-stg-with-scope

on:
  workflow_call:

jobs:
  deploy-stg:
    if: github.ref == 'refs/heads/stg'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    env:
      API_URL: ${{vars.NAVEGA_API_URL_STG}}
      LOAN_API_URL: ${{vars.LOAN_API_URL_STG}}
      DATADOG_CLIENT_TOKEN: ${{secrets.DATADOG_CLIENT_TOKEN_STG}}
      DATADOG_APPLICATION_ID: ${{vars.DATADOG_APPLICATION_ID_STG}}
      DATADOG_SAMPLE_RATE: ${{vars.DATADOG_SAMPLE_RATE_STG}}
      DATADOG_SERVICE: navega-web-stg
      DATADOG_ENV: stg
      KEYCLOAK_URL: ${{vars.KEYCLOAK_URL_STG}}
      ENV: ${{vars.ENV_STG}}
      NPM_REGISTRY: https://registry.npmjs.org/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17

      - name: Config Registry
        run: |
          npm config set registry ${{ env.NPM_REGISTRY }}
          npm config set @navega:registry ${{vars.ARTIFACTORY_NPM_REGISTRY}}

          REGISTRY_PATH=$(echo "${{vars.ARTIFACTORY_NPM_REGISTRY}}" | sed 's|https://||')
          npm config set //$REGISTRY_PATH:_authToken=${{secrets.JF_ACCESS_TOKEN_FRONTEND}}

          echo "always-auth=true" >> ~/.npmrc

      - name: Install
        run: |
          yarn install

      - name: Build
        run: |
          export NODE_OPTIONS="--max_old_space_size=4096"
          yarn build

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ vars.AWS_REGION_STG }}

      - name: Staging Deploy AWS
        run: |
          aws s3 sync dist/ s3://stg.navega.com.vc --delete --cache-control "public, max-age=31536000, immutable"
          INDEX_HTML=$(find dist -name index.html)
          INDEX_COUNT=$(echo "$INDEX_HTML" | grep -c .)
          if [ "$INDEX_COUNT" -ne 1 ]; then
            echo "ERRO: esperava exatamente 1 index.html em dist/, encontrado $INDEX_COUNT:" >&2
            echo "$INDEX_HTML" >&2
            exit 1
          fi
          INDEX_KEY=${INDEX_HTML#dist/}
          aws s3 cp "$INDEX_HTML" "s3://stg.navega.com.vc/$INDEX_KEY" --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation --distribution-id=E28F7DJD6BBQ45 --paths "/*"
