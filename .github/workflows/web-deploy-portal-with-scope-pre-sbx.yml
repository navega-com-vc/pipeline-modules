name: web-deploy-portal-with-scope-pre-sbx

on:
  workflow_call:
    inputs:
      WORKING_DIRECTORY:
        type: string
      BUCKET_PATH:
        type: string
        required: true

jobs:
  deploy-pre-sbx:
    if: github.ref == 'refs/heads/pre-sbx'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    env:
      PORTAL_SHELL_MANIFEST: /assets/mf.manifest.json
      PORTAL_API_URL: ${{ vars.NAVEGA_PORTAL_API_URL_PRE_SBX }}
      DATADOG_APPLICATION_ID: ${{ vars.DD_NAVEGA_PORTAL_APPLICATION_ID_PRE_SBX }}
      DATADOG_CLIENT_TOKEN: ${{ secrets.DD_NAVEGA_PORTAL_CLIENT_TOKEN_PRE_SBX }}
      KEYCLOAK_URL: ${{vars.KEYCLOAK_URL_SBX}}
      ENV: ${{vars.ENV_PRE_SBX}}
      NPM_REGISTRY: https://registry.npmjs.org/


    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17

      - name: Config Registry
        working-directory: ${{ inputs.WORKING_DIRECTORY }}
        run: |
          npm config set registry ${{ env.NPM_REGISTRY }}
          npm config set @navega:registry ${{vars.ARTIFACTORY_NPM_REGISTRY}}

          REGISTRY_PATH=$(echo "${{vars.ARTIFACTORY_NPM_REGISTRY}}" | sed 's|https://||')
          npm config set //$REGISTRY_PATH:_authToken=${{secrets.JF_ACCESS_TOKEN_FRONTEND}}

          echo "always-auth=true" >> ~/.npmrc

      - name: Install & Build Commons
        working-directory: ${{ inputs.WORKING_DIRECTORY }}
        run: |
          cd ../libs/navega-portal-common && yarn install && yarn build

      - name: Install
        working-directory: ${{ inputs.WORKING_DIRECTORY }}
        run: |
          yarn install

      - name: Build
        working-directory: ${{ inputs.WORKING_DIRECTORY }}
        run: |
          yarn build

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID_PRE_SBX }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRE_SBX }}
          aws-region: ${{ vars.AWS_REGION_PRE_SBX }}

      - name: Pre-Sandbox Deploy
        working-directory: ${{ inputs.WORKING_DIRECTORY }}
        run: |
          aws s3 sync dist/ s3://${{inputs.BUCKET_PATH}} --delete --cache-control "public, max-age=31536000, immutable"
          INDEX_HTML=$(find dist -name index.html | head -1)
          if [ -z "$INDEX_HTML" ]; then
            echo "ERRO: nenhum index.html encontrado em dist/ — build pode ter falhado silenciosamente." >&2
            exit 1
          fi
          INDEX_KEY=${INDEX_HTML#dist/}
          aws s3 cp "$INDEX_HTML" "s3://${{inputs.BUCKET_PATH}}/$INDEX_KEY" --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation --distribution-id=EJLDT6RPJB8WZ --paths "/*"
